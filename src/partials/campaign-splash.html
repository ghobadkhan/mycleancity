    <dialog class="campaign-splash" id="campaign-splash" aria-labelledby="splash-title">

        <img class="splash-slide" src="assets/splash2.jpg" alt="Bags, packaging, and cups scattered in grass beside a roadside fence." aria-hidden="true">
