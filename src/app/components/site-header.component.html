<header class="site-header">
  <a class="wordmark" href="#top" aria-label="My Clean City, home">
    <span class="wordmark-icon" aria-hidden="true">MC</span>
    <span>MY CLEAN CITY</span>
  </a>
  <nav aria-label="Main navigation">
    <a #navLink href="#top" [class.is-active]="activeNavIndex === 0" [attr.aria-current]="activeNavIndex === 0 ? 'true' : null">Home</a>
    <a #navLink href="#why" [class.is-active]="activeNavIndex === 1" [attr.aria-current]="activeNavIndex === 1 ? 'true' : null">The issue</a>
    <a #navLink href="#actions" [class.is-active]="activeNavIndex === 2" [attr.aria-current]="activeNavIndex === 2 ? 'true' : null">Take action</a>
    <a #navLink href="#progress" [class.is-active]="activeNavIndex === 3" [attr.aria-current]="activeNavIndex === 3 ? 'true' : null">Progress</a>
    <a #navLink href="#goal" [class.is-active]="activeNavIndex === 4" [attr.aria-current]="activeNavIndex === 4 ? 'true' : null">Our goal</a>
    <a #navLink href="#contact" [class.is-active]="activeNavIndex === 5" [attr.aria-current]="activeNavIndex === 5 ? 'true' : null">Get involved</a>
  </nav>
  <div class="theme-menu" role="group" aria-label="Colour theme" [attr.data-current]="preference">
    <button class="theme-trigger" type="button" aria-haspopup="true" aria-label="Colour theme">
      <svg class="theme-icon" data-icon="system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>
      <svg class="theme-icon" data-icon="light" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="theme-icon" data-icon="dark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>
    </button>
    <div class="theme-options">
      <button type="button" aria-label="System theme" title="System" [attr.aria-pressed]="preference === 'system'" (click)="setTheme('system')"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg></button>
      <button type="button" aria-label="Light theme" title="Light" [attr.aria-pressed]="preference === 'light'" (click)="setTheme('light')"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l-1.4 1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button type="button" aria-label="Dark theme" title="Dark" [attr.aria-pressed]="preference === 'dark'" (click)="setTheme('dark')"><svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
    </div>
  </div>
</header>
